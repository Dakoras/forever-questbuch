<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: ein schmales Questlog — Kopf mit Level-Regler, Reiter, darunter aufklappbare Questkarten mit Schritt-Checklisten */
:root{
  --bg:#f3f1ec; --surface:#fffdf8; --surface-2:#ece8df; --fg:#1d1b18; --muted:#6b655b; --line:#ddd6c8;
  --accent:#a8780f; --accent-soft:#f3e4bd; --accent-ink:#5a3f02;
  --ok:#2f7a45; --ok-soft:#dcefe1; --warn:#9a5b00; --warn-soft:#f7e6c8; --bad:#a3302a; --bad-soft:#f6dcd9; --info:#2d5e93; --info-soft:#dbe7f4;
  --font-display:"Cinzel","Trajan Pro",Georgia,serif; --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
  --q-poor:#7a7a7a; --q-common:#1d1b18; --q-uncommon:#1f8a12; --q-rare:#0b62c4; --q-epic:#8a2fd1; --q-legendary:#c25e00;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14161b; --surface:#1c1f26; --surface-2:#252932; --fg:#ebe7de; --muted:#a39d91; --line:#323743;
  --accent:#e2b247; --accent-soft:#3a3020; --accent-ink:#f3d58c;
  --ok:#6cc488; --ok-soft:#1d3326; --warn:#e6a54a; --warn-soft:#3a2c17; --bad:#ec7b72; --bad-soft:#3d2221; --info:#7fb0e6; --info-soft:#1d2c3e;
  --q-poor:#9d9d9d; --q-common:#f1efe9; --q-uncommon:#3fd62a; --q-rare:#3b9cff; --q-epic:#b56cf2; --q-legendary:#ff9b2e;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161b; --surface:#1c1f26; --surface-2:#252932; --fg:#ebe7de; --muted:#a39d91; --line:#323743;
  --accent:#e2b247; --accent-soft:#3a3020; --accent-ink:#f3d58c;
  --ok:#6cc488; --ok-soft:#1d3326; --warn:#e6a54a; --warn-soft:#3a2c17; --bad:#ec7b72; --bad-soft:#3d2221; --info:#7fb0e6; --info-soft:#1d2c3e;
  --q-poor:#9d9d9d; --q-common:#f1efe9; --q-uncommon:#3fd62a; --q-rare:#3b9cff; --q-epic:#b56cf2; --q-legendary:#ff9b2e;
  color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
h1{font-family:var(--font-display);font-size:1.75rem;letter-spacing:.02em;margin:0;line-height:1.1;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem;margin-top:4px}
.levelbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px 6px 12px}
.levelbox label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.levelbox input{width:3.4em;font:inherit;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;background:var(--surface-2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px}
.charbox{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px 6px 12px}
.charbox label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.charbox select{font:inherit;font-weight:600;background:var(--surface-2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;max-width:9.5em}
.est{font-style:italic;outline:1px dashed currentColor;outline-offset:-1px}
.tag.cls{background:var(--info-soft);color:var(--info)}
.stepper{font:inherit;width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);cursor:pointer;font-weight:700}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{font:inherit;font-weight:600;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 12px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs .count{font-size:.75rem;background:var(--surface-2);border-radius:99px;padding:1px 7px;margin-left:6px;color:var(--muted);font-variant-numeric:tabular-nums}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:inherit;font-size:.82rem;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.search{flex:1 1 180px;min-width:0;font:inherit;font-size:.9rem;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.list{display:flex;flex-direction:column;gap:10px}
.quest{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.quest.done{opacity:.8}
.quest.open{border-color:var(--info);box-shadow:0 0 0 1px var(--info)}
.quest.open .qhead{background:var(--info-soft)}
.quest.open .qhead:hover{background:var(--info-soft)}
.qhead{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px 16px;cursor:pointer;background:none;border:0;width:100%;text-align:left;font:inherit;color:inherit}
.qhead:hover{background:var(--surface-2)}
.qtitle{font-weight:700;font-size:1.02rem;min-width:0}
.kind{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;display:block;margin-bottom:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px;grid-column:1 / -1}
.tag{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.tag.lvl-ok{background:var(--ok-soft);color:var(--ok)}
.tag.lvl-high{background:var(--warn-soft);color:var(--warn)}
.pill{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;align-self:start;white-space:nowrap}
.pill.offen{background:var(--info-soft);color:var(--info)}
.pill.ungeloest{background:var(--bad-soft);color:var(--bad)}
.pill.fertig{background:var(--ok-soft);color:var(--ok)}
.pill.bald{background:var(--accent-soft);color:var(--accent-ink)}
.pill.vorbei{background:var(--surface-2);color:var(--muted)}
.prog{grid-column:1 / -1;display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.teaser{grid-column:1 / -1;font-size:.88rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
.next{grid-column:1 / -1;font-size:.88rem;color:var(--fg);min-width:0}
.next b{color:var(--accent-ink);font-weight:700}
.qbody{padding:4px 16px 16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line)}
.qbody p{margin:0;max-width:68ch}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin-bottom:6px}
.reward{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:8px 12px;font-size:.9rem}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
ol.steps li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:8px;border-radius:8px}
ol.steps li:hover{background:var(--surface-2)}
ol.steps li.is-next{background:var(--accent-soft)}
ol.steps input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);cursor:pointer}
ol.steps li.checked{background:var(--ok-soft)}
ol.steps li.checked + li.checked{border-top:1px solid var(--surface)}
ol.steps li.checked .stext{color:var(--ok)}
ol.steps li.checked .snote{color:var(--ok);opacity:.85}
.stext{min-width:0}
.snote{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}
.slvl{font-size:.72rem;font-weight:700;white-space:nowrap;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.slvl.lvl-ok{background:var(--ok-soft);color:var(--ok)}
.slvl.lvl-high{background:var(--warn-soft);color:var(--warn)}
ol.steps.compact li{grid-template-columns:auto 1fr auto auto;gap:8px;padding:4px 6px;font-size:.88rem;align-items:center}
ol.steps.compact .snote{display:none}
ol.steps.compact li.show-note .snote{display:block}
ol.steps li.sgroup{display:block;padding:12px 6px 4px;font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;background:none}
ol.steps li.sgroup:first-child{padding-top:2px}
.infobtn{font:inherit;font-size:.72rem;font-weight:700;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;padding:0}
li.show-note .infobtn{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.stephead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.stephead .label{margin:0}
.chip.small{font-size:.75rem;padding:3px 10px}
textarea{font:inherit;font-size:.9rem;width:100%;min-height:64px;resize:vertical;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);padding:8px 10px;box-sizing:border-box}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.gallery figure{margin:0;background:var(--surface-2);border-radius:8px;overflow:hidden}
.gallery img{display:block;width:100%;height:auto}
.gallery figcaption{font-size:.78rem;color:var(--muted);padding:6px 8px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.item{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;min-width:0}
.item summary{cursor:pointer;padding:9px 12px;list-style:none;display:flex;flex-direction:column;gap:1px}
.item summary::-webkit-details-marker{display:none}
.item summary::after{content:"Werte anzeigen ▾";font-size:.72rem;color:var(--muted);margin-top:3px}
.item[open] summary::after{content:"Werte ausblenden ▴"}
.iname{font-weight:700}
.iname.poor{color:var(--q-poor)}.iname.common{color:var(--q-common)}.iname.uncommon{color:var(--q-uncommon)}.iname.rare{color:var(--q-rare)}.iname.epic{color:var(--q-epic)}.iname.legendary{color:var(--q-legendary)}
.itype{font-size:.8rem;color:var(--muted)}
.ibody{padding:0 12px 10px;font-size:.86rem;display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums}
.ibody .dmg{display:flex;justify-content:space-between;gap:8px}
.ibody .stat{color:var(--ok)}
.ibody .effect{color:var(--q-uncommon)}
.ibody .inote{color:var(--muted);font-size:.8rem}
.ibody .flav{color:var(--accent-ink);font-style:italic}
.sources{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem}
a{color:var(--info)}
.news{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px}
.news time{font-size:.8rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
.news .nbody{min-width:0;display:flex;flex-direction:column;gap:6px}
.news h3{margin:0;font-size:1rem;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.news ul{margin:0;padding-left:18px}
.news.past{opacity:.7}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel button{font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;border:1px solid var(--info);background:var(--info-soft);color:var(--info);border-radius:99px;padding:4px 12px}
.rel button:hover{background:var(--surface)}
@keyframes flash{from{box-shadow:0 0 0 4px var(--info)}to{box-shadow:0 0 0 1px var(--info)}}
.quest.flash{animation:flash 1.2s ease-out}
@media (prefers-reduced-motion:reduce){.quest.flash{animation:none}}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);margin-bottom:4px}
.notice{font-size:.85rem;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.85rem;z-index:20}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:480px){.news{grid-template-columns:1fr}h1{font-size:1.45rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Forever Questbuch</h1>
      <div class="sub" id="updated">Quests, Geheimnisse und News aus WoW Forever</div>
    </div>
    <div class="levelbox">
      <label for="lvl">Mein Level</label>
      <button class="stepper" id="lvlDown" aria-label="Level verringern">−</button>
      <input id="lvl" type="number" min="1" max="60" inputmode="numeric">
      <button class="stepper" id="lvlUp" aria-label="Level erhöhen">+</button>
    </div>
    <div class="charbox">
      <label for="cls">Klasse</label>
      <select id="cls"></select>
      <label for="race">Volk</label>
      <select id="race"></select>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Bereiche">
    <button role="tab" id="tab-quests" data-tab="quests">Quests &amp; Geheimnisse<span class="count" id="c-quests">0</span></button>
    <button role="tab" id="tab-news" data-tab="news">News<span class="count" id="c-news">0</span></button>
    <button role="tab" id="tab-done" data-tab="done">Erledigt<span class="count" id="c-done">0</span></button>
  </nav>

  <div class="toolbar" id="toolbar">
    <button class="chip" data-filter="alle">Alle</button>
    <button class="chip" data-filter="jetzt">Jetzt machbar</button>
    <button class="chip" data-filter="ungeloest">Ungelöste Rätsel</button>
    <input class="search" id="q" type="search" placeholder="Suchen (Name, Gebiet, Belohnung …)">
  </div>

  <div id="notice" class="notice" hidden></div>
  <main id="list" class="list" aria-live="polite"></main>
</div>
<div class="toast" id="toast" hidden></div>

e, "group": "Level 40+", "id": "b31", "level": 50, "note": "Felsteinfeld: zweiter Stock im Haus neben der Scheune.", "text": "Undead Potatoes: Westliche Pestländer 38.3 54.6"}, {"est": true, "group": "Level 40+", "id": "b32", "level": 50, "note": "Gruft beim Versammlungsstein, neben Franclorn Forgewright. Kein Dungeon nötig.", "text": "Stonewrought Design: Schwarzfels (Brennende Steppe 31.1 30.1)"}, {"est": true, "group": "Level 40+", "id": "b33", "level": 55, "note": "Direkt hinter Lothos Riftwaker, vor den Mobs der Schwarzfelstiefen.", "text": "Magma or Lava?: Schwarzfels"}, {"est": true, "group": "Level 40+", "id": "b34", "level": 55, "note": "In der Kapelle des Hoffnungsvollen Lichts.", "text": "A Study of the Light: Östliche Pestländer 71.8 48.2"}, {"est": true, "group": "Level 40+", "id": "b35", "level": 55, "note": "Abgebranntes Haus am See. Andere Quellen nennen weitere Orte, zählt nur einmal.", "text": "The Knight and the Lady: Östliche Pestländer 47.3 42.3"}, {"est": true, "group": "Level 40+", "id": "b36", "level": 55, "note": "Vor der Brücke nach Stratholme. Auf die Elite-Patrouille achten.", "text": "Scourge: Undead Menace or Misunderstood?: Östliche Pestländer 26.6 14.5"}, {"est": true, "group": "Level 40+", "id": "b37", "level": 55, "note": "Ewige Warte, Regal hinter dem Alchemiebedarf.", "text": "Ka-Boom!: Winterquell 60.4 37.4"}, {"est": true, "group": "Sonderfall", "id": "b38", "level": 38, "note": "Im Käfig. Braucht den Rusted Cage Key (2–3 % Drop von Lost One Hunters und Riftseekers).", "text": "A Luddite's Guide to Caring for Your Demonic Pet: Sümpfe des Elends 61.4 22.4"}, {"group": "Abgabe bei Owen Thadd", "id": "r1", "level": 1, "text": "10 Bücher abgeben: Friend of the Library → Halskette wählen"}, {"group": "Abgabe bei Owen Thadd", "id": "r2", "level": 20, "text": "20 Bücher abgeben: Greater Friend of the Library → Ring wählen"}, {"group": "Abgabe bei Owen Thadd", "id": "r3", "level": 30, "note": "Ein Leser berichtet von 30 statt 25 Büchern.", "text": "25 Bücher abgeben → Bogen, Schild oder Nebenhand wählen (tragbar ab 40)"}], "summary": "Neue Sammelaufgabe: In der ganzen Welt liegen verlorene Bücher einer Bibliothek. Abgabe bei Owen Thadd im Magierviertel von Unterstadt (/way 74.0 32.5). Seit dem Hotfix vom 13. November nimmt er wieder Bücher an, vorher war die Abgabe zeitweise kaputt. Jedes Buch gibt zusätzlich etwas XP und Silber. Buchnamen sind auf Englisch angegeben, die Koordinaten passen zu /way. Achtung: Ein gelöschtes Buch kann man nicht erneut einsammeln, und der Support stellt Gegenstände gerade nicht wieder her.", "tags": ["Sammeln", "Bogen", "Ring"], "title": "Bibliotheksbücher für Owen Thadd", "zone": "Ganz Azeroth, Abgabe Unterstadt", "id": "bibliotheksbuecher"}, {"faction": "Beide (Horde-Weg)", "found": "2026-11-10", "items": [{"name": "Eluvi'ana", "note": "Belohnung aus Teil 1. Werte noch nicht dokumentiert.", "quality": "uncommon", "type": "Einhand-Schwert"}, {"binds": "Seelengebunden", "flavor": "With love always, KG", "itemLevel": 1, "name": "Uralter Erbring", "note": "Keine Werte. Muss für Teile der Kette angelegt sein.", "quality": "common", "type": "Finger (Ring)", "url": "https://foreverchanges.pro/item/264908/ancient-heirloom"}, {"effects": ["Erhellt dunkle Orte (nicht in Gasthäusern und Hauptstädten)"], "name": "Nachtwächterfackel", "note": "Aus der Quest „An Unfortunate End“ in Dämmerwald.", "quality": "common", "type": "Questgegenstand"}], "kind": "secret", "minLevel": 10, "minLevelEst": true, "reward": "Eluvi'ana (grünes Einhandschwert) nach Teil 1. Endbelohnung noch unbekannt, vermutlich Eluvi'tor.", "sources": [{"title": "GameFragger: Quest Chain Zephras Isle → Dire Maul", "url": "https://gamefragger.com/pc/warcraft/wow-forever-players-uncover-a-secret-weapon-quest-chain-that-spans-zephras-isle-to-dire-maul-a30104"}, {"title": "Guided News: Dawn Waker Secret", "url": "https://guided.news/en/news/wow-forever-dawn-waker-secret-eluvi-ana/"}], "status": "ungeloest", "steps": [{"id": "s1", "level": 1, "note": "Skyborne: Quest „Coming of Age“ (hast du schon). Andere Völker: oberstes Stockwerk eines Gebäudes nahe Thendal Village.", "text": "Uralten Erbring holen"}, {"est": true, "id": "s2", "level": 20, "text": "Dämmerwald: Quest „An Unfortunate End“ an der Leiche einer Nachtwache → Nachtwächterfackel"}, {"est": true, "id": "s3", "level": 20, "text": "Fackel in den Ruinen von Ban'aethal (Zephras Isle) benutzen → Uralter Griff"}, {"est": true, "id": "s4", "level": 20, "note": "Die Klinge erscheint an einem zufälligen Ort.", "text": "Griff zu Ealaane Nimbuswalker bringen, dann die Uralte Skyborne-Klinge finden → Eluvi'ana"}, {"id": "s5", "level": 22, "note": "Horde-Weg. Passt gut zur Eschental-Route.", "text": "Tiefschwarze Grotte: Baron Aquanis besiegen → Befleckte Wasserkugel"}, {"id": "s6", "level": 22, "text": "Wasserkugel zu Je'neu im Zoram'gar-Außenposten (Eschental) bringen"}, {"id": "s7", "level": 22, "text": "Mit angelegtem Erbring mit einem Hochgeborenen-Geist am Zoramstrand sprechen"}, {"id": "s8", "level": null, "text": "Narassin auf dem Turm von Althalaxx besiegen → Azsharischer Schlüssel & Narassins Foliant"}, {"est": true, "id": "s9", "level": 40, "note": "Level geschätzt.", "text": "Für Mordent Evenshade (Shen'dralar): Stern der Elune aus dem 5er-Gewölbe in Südferalas (4 Uralte Schalter)"}, {"est": true, "id": "s10", "level": 45, "note": "Braucht die Questreihe Kirith & Azsharite. Level geschätzt.", "text": "Abyssal-Partikel aus der Unterwasser-Truhe in Azshara"}, {"est": true, "id": "s11", "level": 53, "note": "Level geschätzt.", "text": "Tränen der Qual am See Kel'theril in Winterquell sammeln"}, {"id": "s12", "level": null, "text": "Schrein der Vereinigung am Hyjal → Gereinigte Wasserkugel"}, {"est": true, "id": "s14", "level": 55, "note": "Seit 12. November bestätigt: Prinz Tortheldrin spricht erst ab Wohlwollend über die Klingen.", "text": "Ruf bei den Shen'dralar auf Wohlwollend bringen: Libram-Abgaben in Düsterbruch (z. B. Libram of Binding)"}, {"est": true, "id": "s13", "level": 55, "note": "Danach ist die Spur noch offen (Stand 12. November).", "text": "Düsterbruch: mit Prinz Tortheldrin sprechen (erwähnt Eluvi'ana & Eluvi'tor)"}], "summary": "Geheime Questkette rund um den Uralten Erbring der Skyborne. Mit einer Fackel aus Dämmerwald findest du ein uraltes Schwert (Eluvi'ana). Danach führt die Spur über eine verunreinigte Wasserkugel, Geister der Hochgeborenen und die Shen'dralar bis nach Düsterbruch, wo von einer zweiten Klinge namens Eluvi'tor die Rede ist. Teile 1–6 sind bekannt, das Ende ist noch ungelöst. Spätere Teile brauchen vermutlich Level 40+.", "tags": ["Waffe", "Schwert", "Furor", "Erbring"], "title": "Dawn Waker: Eluvi'ana & Eluvi'tor", "zone": "Zephras Isle → Düsterbruch", "id": "dawn-waker"}, {"faction": "Beide (Horde-Weg)", "kind": "quest", "minLevel": 35, "reward": "Dungeon-Beute und Quest-Belohnungen", "sources": [{"title": "Warcraft Tavern: The Drowned City", "url": "https://www.warcrafttavern.com/forever/guides/the-drowned-city/"}, {"title": "Blizzard-Hotfixes 9. November", "url": "https://www.wowhead.com/forever/blue-tracker/news/eu/wow-forever-hotfixes-november-10-2026-world-of-warcraft-blizzard-news-24315281"}], "status": "offen", "steps": [{"id": "s1", "level": 35, "note": "Aus der Beta, es gibt eventuell weitere.", "text": "Horde-Quests vorher annehmen: „Ancient Gurubashi Idol“, „The Drowned City“, „The Only Good Brinescale…“"}, {"id": "s2", "level": 35, "note": "Höhle mit einer großen Steintafel daneben, nahe der Insel mit den Wasserelementaren.", "text": "Eingang finden: Schlingendorntal ca. 21.4 27.9, am Vile Reef vorbei zum Sunken Hollow schwimmen"}, {"id": "s3", "level": 35, "text": "Dungeon abschließen"}], "summary": "Einer der neuen Forever-Dungeons für Level 35–42: eine versunkene Ruine voller Trolle und Naga. Der Eingang liegt unter Wasser vor dem Schlingendorntal. Seit dem 9. November deutlich entschärft, vorher machte ein Fehler ca. 30 % z Variante: gleichmäßigere Wut.", "quality": "rare", "speed": "2,90", "stats": ["+16 Stärke", "+15 Ausdauer"], "type": "Zweihand-Schwert", "url": "https://www.wowhead.com/forever/de/search?q=Whirlwind+Sword"}, {"binds": "Wird beim Aufheben gebunden", "damage": "97–146", "dps": "35,7", "itemLevel": 40, "name": "Wirbelwindkriegshammer", "note": "Nur für Krieger.", "quality": "rare", "speed": "3,40", "stats": ["+16 Stärke", "+15 Ausdauer"], "type": "Zweihand-Streitkolben", "url": "https://www.wowhead.com/forever/de/search?q=Whirlwind+Warhammer"}], "kind": "quest", "minLevel": 30, "reward": "Berserkerhaltung, dann Wirbelwindaxt / -schwert / -hammer (2H, +16 Stärke, +15 Ausdauer)", "sources": [{"title": "forg.gg: Whirlwind Weapon (Forever)", "url": "https://forg.gg/en/forever/tips/whirlwind-weapon"}, {"title": "MMOJugg: Whirlwind Axe Route", "url": "https://www.mmojugg.com/news/wow-forever-whirlwind-axe-quest-guide.html"}, {"title": "Metabot: Whirlwind Axe Werte", "url": "https://metabot.gg/en/wow-forever/items/whirlwind-axe"}], "status": "offen", "steps": [{"group": "Teil 1 · sofort mit 30 (solo)", "id": "s1", "level": 30, "text": "„The Islander“ bei Sorek in Orgrimmar annehmen"}, {"group": "Teil 1 · sofort mit 30 (solo)", "id": "s2", "level": 30, "note": "Südlich von Ratschet die Küste entlang, durch die Untiefen zur Insel.", "text": "Zu Klannoc Macleod auf der Insel Fray (Brachland 68.6 49.2)"}, {"group": "Teil 1 · sofort mit 30 (solo)", "id": "s3", "level": 30, "note": "Mit voller Wut starten, Heiltränke bereithalten. Auf 31–32 deutlich leichter.", "text": "„The Affray“: aufs Gitter in der Mitte treten, Herausforderer und Big Will (Stufe 33) besiegen → Berserkerhaltung"}, {"group": "Vorbereitung · jederzeit", "id": "s4", "level": 1, "note": "Oder selbst pflücken (Kräuterkunde). Am besten schon zum ersten Besuch bei Bath'rah mitnehmen.", "text": "8 Lebenswurz im Auktionshaus kaufen"}, {"group": "Teil 2 · ab 30, sobald du in der Gegend bist", "id": "s5", "level": 30, "note": "Am Fluss östlich von Tarrens Mühle nach Norden. Cyclonian vor dem Sammeln annehmen, sonst droppen die Hauer nicht.", "text": "„The Windwatcher“: zu Bath'rah im östlichen Alteracgebirge (80.5 66.9) und „Cyclonian“ annehmen"}, {"group": "Teil 2 · beim Questen im Schlingendorntal", "id": "s6", "level": 33, "note": "Trolle Stufe 33–35 im Nordwesten. Dauert etwas, mit den Troll-Quests aus Grom'gol zusammen erledigen.", "text": "30 Hauer der Blutskalpe von den Blutskalp-Trollen (Schlingendorntal 25.7 12.1)"}, {"group": "Teil 2 · beim Questen im Arathihochland", "id": "s7", "level": 38, "note": "Gegner Stufe 38–39.", "text": "8 Burning Charms von Burning Exiles (Arathi West, 25.8 30.7)"}, {"group": "Teil 2 · beim Questen im Arathihochland", "id": "s8", "level": 38, "text": "8 Cresting Charms von Cresting Exiles (Arathi Ost, 66.6 29.9)"}, {"group": "Teil 2 · beim Questen im Arathihochland", "id": "s9", "level": 38, "text": "8 Thundering Charms von Thundering Exiles (Arathi Mitte, 52.2 50.8)"}, {"group": "Abschluss · mit Gruppe ab ca. 37, solo eher später", "id": "s10", "level": 38, "note": "Nur Tragen reicht nicht, der Kessel muss benutzt werden.", "text": "Am Kessel bei Bath'rah (79.4 66.7) die 24 Charms zur Essence of the Exile verarbeiten"}, {"group": "Abschluss · mit Gruppe ab ca. 37, solo eher später", "id": "s11", "level": 38, "text": "„Cyclonian“ abgeben: 8 Lebenswurz, 30 Hauer, Essence"}, {"est": true, "group": "Abschluss · mit Gruppe ab ca. 37, solo eher später", "id": "s12", "level": 37, "note": "Gruppe aus 2–3 Leuten mitnehmen, Rollen vorher absprechen.", "text": "„The Summoning“: Cyclonian (Elite, Stufe 40) besiegen → Whirlwind Heart"}, {"est": true, "group": "Abschluss · mit Gruppe ab ca. 37, solo eher später", "id": "s13", "level": 37, "text": "Herz bei Bath'rah abgeben → Waffe wählen (Axt, Schwert oder Hammer)"}], "summary": "Krieger-Klassenquest ab Level 30 in zwei Teilen. Teil 1 (Berserkerhaltung) machst du sofort mit 30, allein. Teil 2 (die Waffe) ist eine Sammelaufgabe für Gegner der Stufe 33–40 und endet mit dem Elite-Elementar Cyclonian (Stufe 40). Realistisch hast du die Axt also eher mit 37–40, außer du holst dir Hilfe. Tipp: Die Materialien nebenbei sammeln, während du im Schlingendorntal und im Arathihochland questest.", "tags": ["Krieger", "Klassenquest", "Zweihand"], "title": "Berserkerhaltung & Wirbelwindaxt", "zone": "Brachland, Alterac, Arathi, Schlingendorn", "id": "wirbelwindaxt"}, {"faction": "Beide", "kind": "secret", "minLevel": 1, "reward": "Ausrüstung gegen Windstones", "sources": [{"title": "LostWoW: Forever Secrets", "url": "https://lostwow.com/ForeverSecrets.shtml"}], "status": "offen", "steps": [{"id": "s1", "level": null, "text": "Schrein auf Zephras Isle finden"}, {"id": "s2", "level": null, "text": "Windstones sammeln und bei Zendraas eintauschen"}], "summary": "Ein versteckter Händler an einem Schrein auf Zephras Isle. Er tauscht Ausrüstung gegen Windstones, die man in der Welt sammelt.", "tags": ["Händler"], "title": "Versteckter Händler: Brother Zendraas", "zone": "Zephras Isle (Schrein)", "id": "zendraas"}], "meta": {"updated": "2026-11-14"}}</script>
<script>
(function(){
  const $ = s => document.querySelector(s);
  const ls = {get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

  const state = {
    entries: [], meta: null,
    progress: ls.get('fq.progress', {done:{}, notes:{}}),
    tab: ls.get('fq.tab','quests'), filter: ls.get('fq.filter','alle'),
    level: ls.get('fq.level', 25), open: new Set(ls.get('fq.open', [])),
    query: '', dbStatus: 'loading', hideDone: ls.get('fq.hideDone', false),
    cls: ls.get('fq.cls','Alle'), race: ls.get('fq.race','Alle')
  };
  const CLASSES = ['Krieger','Paladin','Jäger','Schurke','Priester','Schamane','Magier','Hexenmeister','Druide'];
  const RACES = ['Orc','Untoter','Taure','Troll','Skyborne','Mensch','Zwerg','Nachtelf','Gnom'];
  const HORDE = ['Orc','Untoter','Taure','Troll'], ALLY = ['Mensch','Zwerg','Nachtelf','Gnom'];
  function fitsChar(e){
    const c = Array.isArray(e.classes) ? e.classes : [], r = Array.isArray(e.races) ? e.races : [];
    if (c.length && (state.cls==='Alle' || !c.includes(state.cls))) return false;
    if (r.length && (state.race==='Alle' || !r.includes(state.race))) return false;
    if (state.race!=='Alle'){
      if (e.faction==='Horde' && ALLY.includes(state.race)) return false;
      if (e.faction==='Allianz' && HORDE.includes(state.race)) return false;
    }
    return true;
  }
  let progRef = null;

  const KIND = {quest:'Quest', secret:'Geheimnis', pet:'Haustier', item:'Gegenstand', event:'Event'};
  const STATUS = {offen:'Offen', ungeloest:'Ungelöst', fertig:'Gelöst', bald:'Bald', vorbei:'Vorbei'};

  function el(tag, attrs, ...kids){
    const n = document.createElement(tag);
    if (attrs) for (const [k,v] of Object.entries(attrs)){
      if (v==null || v===false) continue;
      if (k==='class') n.className = v; else if (k==='text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v===true?'':v);
    }
    for (const c of kids.flat()) if (c!=null && c!==false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
    return n;
  }
  function fmtDate(s){ if(!s) return ''; const d=new Date(s+'T12:00:00'); return isNaN(d)?s:d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}); }
  function safeUrl(u){ return typeof u==='string' && (/^https:\/\//.test(u) || u.startsWith('/')) ? u : null; }
  function lvlText(l, est){ return l==null ? 'Level ?' : (est ? 'ca. ' : 'ab ')+l; }
  function lvlClass(l){ return l==null ? '' : (l <= state.level ? 'lvl-ok' : 'lvl-high'); }

  const key = (e,s) => e.id+':'+s.id;
  const steps = e => Array.isArray(e.steps) ? e.steps : [];
  const doneCount = e => steps(e).filter(s => state.progress.done[key(e,s)]).length;
  const isDone = e => steps(e).length>0 && doneCount(e)===steps(e).length;
  const nextStep = e => steps(e).find(s => !state.progress.done[key(e,s)]);
  const doable = e => { const n = nextStep(e); if(!n) return false; const l = n.level ?? e.minLevel; return l==null || l <= state.level; };

  function matchesQuery(e){
    if(!state.query) return true;
    const hay = [e.title,e.summary,e.zone,e.reward,(e.tags||[]).join(' '),...steps(e).map(s=>s.text)].join(' ').toLowerCase();
    return state.query.toLowerCase().split(/\s+/).every(w => hay.includes(w));
  }

  // ---------- Fortschritt speichern ----------
  let writing=false, pending=false, noteTimer=null;
  function saveProgress(){
    ls.set('fq.progress', state.progress);
    if(!progRef) return;
    pending = true; if(writing) return; flush();
  }
  async function flush(){
    while(pending){
      pending=false; writing=true;
      try{ await progRef.set(JSON.parse(JSON.stringify(state.progress))); }
      catch(err){ toast('Fortschritt nur auf diesem Gerät gespeichert.'); }
      writing=false;
    }
  }

  let toastTimer;
  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true,2600); }

  // ---------- Render ----------
  function render(){
    const quests = state.entries.filter(e => e.kind!=='news' && fitsChar(e));
    const news = state.entries.filter(e => e.kind==='news');
    const active = quests.filter(e => !isDone(e));
    const done = quests.filter(isDone);
    $('#c-quests').textContent = active.length; $('#c-news').textContent = news.length; $('#c-done').textContent = done.length;
    document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab===state.tab)));
    document.querySelectorAll('[data-filter]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.filter===state.filter)));
    $('#toolbar').querySelectorAll('[data-filter]').forEach(b => b.hidden = state.tab!=='quests');
    $('#lvl').value = state.level;
    $('#updated').textContent = state.meta && state.meta.updated ? 'Zuletzt aktualisiert: '+fmtDate(state.meta.updated) : 'Quests, Geheimnisse und News aus WoW Forever';

    const list = $('#list'); list.replaceChildren();
    if (state.dbStatus==='loading' && !state.entries.length){ list.append(el('div',{class:'empty'}, el('strong',{text:'Questbuch wird geladen …'}),'Einen Moment.')); return; }
    if (!state.entries.length){
      list.append(el('div',{class:'empty'}, el('strong',{text:'Noch keine Einträge'}), 'Sag Claude „Update“, dann kommen neue Quests, Geheimnisse und News hier rein.'));
      return;
    }

    if (state.tab==='news'){
      const items = news.filter(matchesQuery).sort((a,b)=>(b.found||'').localeCompare(a.found||''));
      if(!items.length) list.append(el('div',{class:'empty'}, el('strong',{text:'Keine News gefunden'}), 'Versuch einen anderen Suchbegriff.'));
      items.forEach(n => list.append(newsCard(n)));
      return;
    }

    let items = (state.tab==='done' ? done : active).filter(matchesQuery);
    if (state.tab==='quests'){
      if (state.filter==='jetzt') items = items.filter(doable);
      if (state.filter==='ungeloest') items = items.filter(e => e.status==='ungeloest');
    }
    items.sort((a,b) => (Number(doable(b))-Number(doable(a))) || ((a.minLevel??99)-(b.minLevel??99)) || (a.title||'').localeCompare(b.title||''));
    if(!items.length){
      const msg = state.tab==='done' ? ['Noch nichts erledigt','Hak in einer Quest alle Schritte ab, dann landet sie hier.']
        : state.filter==='jetzt' ? ['Gerade nichts auf deinem Level','Stell oben dein Level ein oder schau unter „Alle“.'] : ['Nichts gefunden','Versuch einen anderen Filter oder Suchbegriff.'];
      list.append(el('div',{class:'empty'}, el('strong',{text:msg[0]}), msg[1]));
    }
    items.forEach(e => list.append(questCard(e)));
  }

  function questCard(e){
    const total = steps(e).length, d = doneCount(e), n = nextStep(e), open = state.open.has(e.id);
    const status = isDone(e) ? 'fertig' : (e.status || 'offen');
    const head = el('button',{class:'qhead','aria-expanded':String(open), onclick:()=>{ open?state.open.delete(e.id):state.open.add(e.id); ls.set('fq.open',[...state.open]); render(); }},
      el('div',{class:'qtitle'}, el('span',{class:'kind',text:KIND[e.kind]||'Eintrag'}), e.title||''),
      el('span',{class:'pill '+status, text: isDone(e)?'Erledigt':(STATUS[status]||status)}),
      el('div',{class:'meta'},
        el('span',{class:'tag '+lvlClass(e.minLevel)+(e.minLevelEst?' est':''), title:e.minLevelEst?'Level geschätzt':null, text:lvlText(e.minLevel, e.minLevelEst)}),
        e.zone && el('span',{class:'tag',text:e.zone}),
        e.faction && el('span',{class:'tag',text:e.faction}),
        (Array.isArray(e.classes) && e.classes.length) ? el('span',{class:'tag cls',text:e.classes.join(', ')}) : null,
        (Array.isArray(e.races) && e.races.length) ? el('span',{class:'tag cls',text:e.races.join(', ')}) : null,
        e.found && el('span',{class:'tag',text:'gefunden '+fmtDate(e.found)})
      ),
      (e.summary && !open) ? el('div',{class:'teaser',text:e.summary}) : null,
      total ? el('div',{class:'prog'}, el('div',{class:'bar'}, el('i',{style:'width:'+Math.round(d/total*100)+'%'})), d+' / '+total+' Schritte') : null,
      (n && !open) ? el('div',{class:'next'}, el('b',{text:'Als Nächstes: '}), n.text, ' ', el('span',{class:'slvl '+lvlClass(n.level ?? e.minLevel)+((n.level!=null ? n.est : e.minLevelEst)?' est':''), text:lvlText(n.level ?? e.minLevel, n.level!=null ? n.est : e.minLevelEst)})) : null
    );
    const card = el('article',{class:'quest'+(isDone(e)?' done':'')+(open?' open':''), id:'q-'+e.id}, head);
    if (!open) return card;

    const body = el('div',{class:'qbody'});
    if (e.summary) body.append(el('p',{text:e.summary}));
    if (e.reward) body.append(el('div',{class:'reward'}, el('strong',{text:'Belohnung: '}), e.reward));
    if (total){
      const compact = total > 12;
      const ol = el('ol',{class:'steps'+(compact?' compact':'')});
      let lastGroup = null;
      steps(e).forEach((s,i) => {
        const k = key(e,s), checked = !!state.progress.done[k], id = 'cb-'+e.id+'-'+s.id;
        if (compact && state.hideDone && checked) return;
        if (s.group && s.group !== lastGroup){ lastGroup = s.group; ol.append(el('li',{class:'sgroup',text:s.group})); }
        const lvl = s.level ?? null;
        const li = el('li',{class:(checked?'checked ':'')+(n===s?'is-next':'')});
        li.append(
          el('input',{type:'checkbox',id, checked, onchange:ev=>{ if(ev.target.checked) state.progress.done[k]=true; else delete state.progress.done[k]; saveProgress(); render(); }}),
          el('label',{class:'stext',for:id}, (compact ? '' : (i+1)+'. ')+s.text, s.note ? el('span',{class:'snote',text:s.note}) : null),
          el('span',{class:'slvl '+lvlClass(lvl)+(s.est?' est':''), title:s.est?'Level geschätzt':null, text: lvl==null ? '–' : lvlText(lvl, s.est)})
        );
        if (compact) li.append(s.note ? el('button',{class:'infobtn','aria-label':'Details anzeigen',title:'Details',text:'i',onclick:()=>li.classList.toggle('show-note')}) : el('span'));
        ol.append(li);
      });
      const head = el('div',{class:'stephead'}, el('div',{class:'label',text:'Schritte'}),
        compact ? el('button',{class:'chip small','aria-pressed':String(!!state.hideDone),text:'Erledigte ausblenden',onclick:()=>{ state.hideDone=!state.hideDone; ls.set('fq.hideDone',state.hideDone); render(); }}) : null);
      body.append(el('div',null, head, ol));
    }
    if (Array.isArray(e.items) && e.items.length){
      body.append(el('div',null, el('div',{class:'label',text:'Gegenstände'}), el('div',{class:'items'}, e.items.map(itemCard))));
    }
    if (Array.isArray(e.images) && e.images.length){
      const g = el('div',{class:'gallery'});
      e.images.forEach(im => { const u = safeUrl(im.url); if(u) g.append(el('figure',null, el('img',{src:u, alt:im.caption||'', loading:'lazy'}), im.caption ? el('figcaption',{text:im.caption}) : null)); });
      body.append(el('div',null, el('div',{class:'label',text:'Bilder'}), g));
    }
    const ta = el('textarea',{id:'note-'+e.id, placeholder:'Eigene Notizen, z. B. Koordinaten oder wer mitkommt …', oninput:ev=>{ state.progress.notes[e.id]=ev.target.value; clearTimeout(noteTimer); noteTimer=setTimeout(saveProgress,900); }});
    ta.value = state.progress.notes[e.id] || '';
    body.append(el('div',null, el('label',{class:'label',for:'note-'+e.id,text:'Meine Notizen'}), ta));
    if (Array.isArray(e.sources) && e.sources.length){
      body.append(el('div',null, el('div',{class:'label',text:'Quellen'}),
        el('div',{class:'sources'}, e.sources.map(s => { const u=safeUrl(s.url); return u ? el('a',{href:u,target:'_blank',rel:'noopener',text:s.title||u}) : null; }))));
    }
    card.append(body);
    return card;
  }

  const QUAL = {poor:'Schlecht', common:'Gewöhnlich', uncommon:'Ungewöhnlich', rare:'Selten', epic:'Episch', legendary:'Legendär'};
  function itemCard(it){
    const q = QUAL[it.quality] ? it.quality : 'common';
    const b = el('div',{class:'ibody'});
    if (it.binds) b.append(el('div',{text:it.binds}));
    if (it.damage || it.speed) b.append(el('div',{class:'dmg'}, el('span',{text:it.damage ? it.damage+' Schaden' : ''}), el('span',{text:it.speed ? 'Tempo '+it.speed : ''})));
    if (it.dps) b.append(el('div',{text:'('+it.dps+' Schaden pro Sekunde)'}));
    (it.stats||[]).forEach(s => b.append(el('div',{class:'stat',text:s})));
    (it.effects||[]).forEach(s => b.append(el('div',{class:'effect',text:s})));
    if (it.reqLevel) b.append(el('div',{text:'Benötigt Stufe '+it.reqLevel}));
    if (it.itemLevel) b.append(el('div',{class:'inote',text:'Gegenstandsstufe '+it.itemLevel}));
    if (it.flavor) b.append(el('div',{class:'flav',text:'„'+it.flavor+'“'}));
    if (it.note) b.append(el('div',{class:'inote',text:it.note}));
    const u = safeUrl(it.url) || ('https://www.wowhead.com/forever/de/search?q='+encodeURIComponent(it.name||''));
    b.append(el('a',{href:u,target:'_blank',rel:'noopener',text:'Auf Wowhead ansehen'}));
    return el('details',{class:'item'}, el('summary',null, el('span',{class:'iname '+q,text:it.name||''}), el('span',{class:'itype',text:[QUAL[it.quality], it.type].filter(Boolean).join(' · ')})), b);
  }

  function newsCard(n){
    const past = n.status==='vorbei';
    const nb = el('div',{class:'nbody'},
      el('h3',null, n.title||'', n.status ? el('span',{class:'pill '+n.status, text:STATUS[n.status]||n.status}) : null, n.category ? el('span',{class:'tag',text:n.category}) : null));
    if (n.summary) nb.append(el('p',{text:n.summary, style:'margin:0'}));
    if (Array.isArray(n.points) && n.points.length) nb.append(el('ul',null, n.points.map(p => el('li',{text:p}))));
    if (Array.isArray(n.images) && n.images.length){
      const g = el('div',{class:'gallery'}); n.images.forEach(im=>{const u=safeUrl(im.url); if(u) g.append(el('figure',null, el('img',{src:u,alt:im.caption||'',loading:'lazy'}), im.caption?el('figcaption',{text:im.caption}):null));}); nb.append(g);
    }
    const rel = (Array.isArray(n.related) ? n.related : []).map(id => state.entries.find(x => x.id===id && x.kind!=='news')).filter(Boolean);
    if (rel.length) nb.append(el('div',{class:'rel'}, rel.map(q => el('button',{text:'Zur Quest: '+(q.title||''), onclick:()=>goToQuest(q.id)}))));
    if (Array.isArray(n.sources) && n.sources.length) nb.append(el('div',{class:'sources'}, n.sources.map(s => { const u=safeUrl(s.url); return u ? el('a',{href:u,target:'_blank',rel:'noopener',text:s.title||u}) : null; })));
    return el('article',{class:'news'+(past?' past':'')}, el('time',{text:fmtDate(n.found)}), nb);
  }

  function goToQuest(id){
    const q = state.entries.find(x => x.id===id); if(!q) return;
    if (!fitsChar(q)){
      state.cls = (Array.isArray(q.classes) && q.classes.length) ? (q.classes.includes(state.cls) ? state.cls : q.classes[0]) : state.cls;
      state.race = (Array.isArray(q.races) && q.races.length) ? (q.races.includes(state.race) ? state.race : q.races[0]) : 'Alle';
      ls.set('fq.cls',state.cls); ls.set('fq.race',state.race); $('#cls').value=state.cls; $('#race').value=state.race;
    }
    state.tab = isDone(q) ? 'done' : 'quests'; state.filter='alle'; state.query=''; $('#q').value='';
    ls.set('fq.tab',state.tab); ls.set('fq.filter',state.filter);
    state.open.add(id); ls.set('fq.open',[...state.open]);
    render();
    const c = document.getElementById('q-'+id);
    if (c){ c.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'}); c.classList.add('flash'); setTimeout(()=>c.classList.remove('flash'),1300); }
  }

  // ---------- Bedienung ----------
  [['#cls',CLASSES,'cls','Keine (nur Allgemeines)'],['#race',RACES,'race','Keins (nur Allgemeines)']].forEach(([sel,list,k,allLabel]) => {
    const s = $(sel);
    s.append(el('option',{value:'Alle',text:allLabel}), ...list.map(v => el('option',{value:v,text:v})));
    s.value = list.includes(state[k]) ? state[k] : 'Alle';
    s.addEventListener('change', ev => { state[k] = ev.target.value; ls.set('fq.'+k, state[k]); render(); });
  });
  document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click',()=>{ state.tab=b.dataset.tab; ls.set('fq.tab',state.tab); render(); }));
  document.querySelectorAll('[data-filter]').forEach(b => b.addEventListener('click',()=>{ state.filter=b.dataset.filter; ls.set('fq.filter',state.filter); render(); }));
  function setLevel(v){ v = Math.max(1, Math.min(60, parseInt(v,10)||1)); state.level=v; ls.set('fq.level',v); render(); }
  $('#lvl').addEventListener('change', ev => setLevel(ev.target.value));
  $('#lvlUp').addEventListener('click', ()=>setLevel(state.level+1));
  $('#lvlDown').addEventListener('click', ()=>setLevel(state.level-1));
  $('#q').addEventListener('input', ev => { state.query = ev.target.value.trim(); render(); });

  render();

  // ---------- Daten (statisch eingebettet) ----------
  try{
    const DATA = JSON.parse(document.getElementById('questdata').textContent);
    state.entries = DATA.entries || []; state.meta = DATA.meta || null;
  }catch(e){ state.entries = []; }
  state.dbStatus = 'ready'; render();

  function showNotice(t){ const n=$('#notice'); n.textContent=t; n.hidden=false; }
  function hideNotice(){ $('#notice').hidden=true; }
})();
</script>
</body></html>
